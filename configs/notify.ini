; The notification node of the system: /dev/notify (the node is named after this section - the name the clients look for).
;
; A module that has something to tell the user opens the node for writing and notifies (DMNOTIFY_IOCTL_CMD_NOTIFY); the interface of
; the device (a launcher, a status bar) opens it for reading and subscribes (DMNOTIFY_IOCTL_CMD_SUBSCRIBE). Who can do which is a
; matter of the access rights of the node - see docs/README.md.
;
; From a shell: `echo "Tea is ready" > /dev/notify` notifies, `cat /dev/notify` lists what is active.
;
; max_notifications: how many notifications are kept as active; one more cancels the oldest (default 16).

[notify]
driver_name=dmnotify
max_notifications=16
